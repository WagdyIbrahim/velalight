<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>VelaLight - شموع يدوية</title>

<style>
body {
    font-family: Arial;
    background: #fff8f0;
    text-align: center;
    color: #4b3621;
}

header {
    background: #c89b6d;
    color: white;
    padding: 25px;
}

.product {
    background: white;
    width: 280px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px #ddd;
}

.product img {
    width: 100%;
    border-radius: 10px;
}

button {
    background: #8b5e3c;
    color: white;
    border: 0;
    padding: 12px 25px;
    border-radius: 20px;
}
</style>

</head>

<body>

<header>
<h1>VelaLight</h1>
<p>شموع يدوية مصنوعة بإتقان وحرفية</p>
</header>


<div class="product">

<img src="https://via.placeholder.com/280">

<h2>شمعة فانيليا</h2>

<p>رائحة هادئة ومميزة</p>

<h3>100 جنيه</h3>

<button>اطلب الآن</button>

</div>


<div class="product">

<img src="https://via.placeholder.com/280">

<h2>شمعة ورد</h2>

<p>تصميم يدوي أنيق</p>

<h3>120 جنيه</h3>

<button>اطلب الآن</button>

</div>


</body>
</html>
